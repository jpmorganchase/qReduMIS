[quantum]
# Rydberg drive schedule used by the quantum-annealing informer.
# The path may be absolute or relative to the package root (the directory that
# contains this configurations.ini file). A sample schedule is shipped with the
# package under input_data/schedules/.
schedule = input_data/schedules/optimized_piecewise_linear_schedule_large_HP.json

[qaoa]
# Number of QAOA layers (circuit depth)
p = 10
# Angle strategy: "new" (MIS params), "maxcut", or "sk"
qaoa_params = new
# Number of measurement shots per circuit
num_shots = 1000

[braket]
# Amazon Braket writes the results of every QPU task to an S3 bucket in your
# own AWS account, so no default can be shipped here. Set the values below (or
# the AWS_BRAKET_S3_BUCKET / AWS_BRAKET_S3_PREFIX environment variables, which
# take precedence) before running on real hardware such as QuEra Aquila.
# Not required for local-simulator runs.
#
# bucket = amazon-braket-<region>-<your-account-id>
# prefix = qredumis
bucket =
prefix =
